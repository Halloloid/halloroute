<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HalloRoute — Control Room</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/logs-playground.css" />
  <link rel="stylesheet" href="/static/quotas.css" />
  <link rel="stylesheet" href="/static/client-setup.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="/static/sse.js"></script>
</head>
<body hx-ext="sse" sse-connect="/admin/events">
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">HR</div>
        <strong>HalloRoute</strong>
        <span class="version">v0.9</span>
      </div>
      <div class="top-title">HALLO<span>/</span>ROUTE — CONTROL ROOM</div>
      <div class="live-indicator"><i></i> LIVE</div>
    </header>

    <aside class="sidebar">
      <div class="nav-heading">ROUTING</div>
      <nav>
        <a class="nav-item {% if active_tab == "overview" %}active{% endif %}"
           hx-get="/dashboard/tab/overview" 
           hx-target="#main-tab-content"
           hx-swap="innerHTML"
           onclick="document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active')); this.classList.add('active');">
          <b>•</b> Overview
        </a>
        <a class="nav-item {% if active_tab == "providers" %}active{% endif %}"
           hx-get="/dashboard/tab/providers" 
           hx-target="#main-tab-content"
           hx-swap="innerHTML"
           onclick="document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active')); this.classList.add('active');">
          <b>▫</b> Providers
        </a>
        <a class="nav-item {% if active_tab == "logs" %}active{% endif %}"
           hx-get="/dashboard/tab/logs" 
           hx-target="#main-tab-content"
           hx-swap="innerHTML"
           onclick="document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active')); this.classList.add('active');">
          <b>▫</b> Logs &amp; Playground
        </a>
        <a class="nav-item {% if active_tab == "quotas" %}active{% endif %}"
           hx-get="/dashboard/tab/quotas" 
           hx-target="#main-tab-content"
           hx-swap="innerHTML"
           onclick="document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active')); this.classList.add('active');">
          <b>▫</b> Quotas &amp; Analytics
        </a>
        <a class="nav-item {% if active_tab == "client_setup" %}active{% endif %}"
           hx-get="/dashboard/tab/client-setup" 
           hx-target="#main-tab-content"
           hx-swap="innerHTML"
           onclick="document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active')); this.classList.add('active');">
          <b>▫</b> Client Setup Hub
        </a>
      </nav>
      <div class="sidebar-footer">
        <div><span>UPTIME</span><strong class="text-green">99.98%</strong></div>
        <div><span>RAM</span><span>{{ memory_mb }} MB</span></div>
      </div>
    </aside>

    <main class="main-content" id="main-tab-content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
