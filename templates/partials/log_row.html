<tr>
  <td>{{ log.timestamp }}</td>
  <td class="model">{{ log.model }}</td>
  <td>{{ log.provider }}</td>
  <td class="status {% if log.status == 200 %}success{% else if log.status == 429 || log.status == 400 %}warning{% else %}failed{% endif %}">{{ log.status }}</td>
  <td class="latency">{{ log.latency_ms }}ms</td>
</tr>
