version: '3.8'

services:
  rust-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:20128:20128"
    environment:
      - HALLO_ROUTE_HOST=0.0.0.0
      - HALLO_ROUTE_PORT=20128
      - HALLO_ROUTE_DB_PATH=/app/data/halloroute.db
      - RUST_LOG=halloroute=debug,actix_web=info
      # Add provider API keys as needed
      # - GROQ_API_KEY=${GROQ_API_KEY}
      # - TOGETHER_API_KEY=${TOGETHER_API_KEY}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20128/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
